<li class="card">
    <a class="card__link" href="{{ url_for('pokemon', id=pokemon.id) }}">
        <span class="card__id">#{{ pokemon.id }}</span>
        <img class="card__img" src="{{ pokemon.sprites.front_default }}" alt="{{ pokemon.name }}">
        <h3 class="card__name">{{ pokemon.name | capitalize }}</h3>
        <ul class="types">
            {% for t in pokemon.types %}
            <li class="type type--{{ t }}">{{ t }}</li>
            {% endfor %}
        </ul>
    </a>
</li>
